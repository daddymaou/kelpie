services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kelpie
      POSTGRES_PASSWORD: kelpie
      POSTGRES_DB: kelpie
    ports:
      - '5432:5432'
    volumes:
      - kelpie_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kelpie -d kelpie']
      interval: 5s
      timeout: 5s
      retries: 10

  kelpie:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgres://kelpie:kelpie@postgres:5432/kelpie
      KELPIE_AUTH: none
      KELPIE_PORT: '3000'
      KELPIE_CORS_ORIGIN: '*'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kelpie_pg_data:
